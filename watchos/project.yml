name: EpiphanyWatch
options:
  bundleIdPrefix: com.heyitsmejosh
  deploymentTarget:
    watchOS: "10.0"
settings:
  DEVELOPMENT_TEAM: QMM486NPYC
  SWIFT_VERSION: "6.0"
  MARKETING_VERSION: "32.0.0"
  CURRENT_PROJECT_VERSION: "202610201300"
  CODE_SIGN_STYLE: Automatic
targets:
  EpiphanyWatch:
    type: application
    platform: watchOS
    sources:
      - path: .
        excludes:
          - "*.xcodeproj"
          - "*.yml"
          - "*.md"
          - "*.svg"
          - MonicaWatchApp.swift
    settings:
      INFOPLIST_FILE: ""
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_WKWatchOnly: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.epiphany.watchos
      ASSETCATALOG_COMPILER_APPICON_NAME: Epiphany
      PRODUCT_NAME: Epiphany
    dependencies:
      - target: EpiphanyComplication
  EpiphanyComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: ../watchos-widgets
        excludes:
          - Info.plist
      - path: Models/WatchAPI.swift
      - path: Models/WatchModels.swift
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Epiphany
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.epiphany.watchos.complication
      SKIP_INSTALL: YES
    info:
      path: ../watchos-widgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
