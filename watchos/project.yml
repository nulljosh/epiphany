name: EpiphanyWatch
options:
  bundleIdPrefix: com.heyitsmejosh
  deploymentTarget:
    watchOS: "10.0"
settings:
  DEVELOPMENT_TEAM: QMM486NPYC
  SWIFT_VERSION: "6.0"
  MARKETING_VERSION: "2.5.16"
  CURRENT_PROJECT_VERSION: "202610031500"
  CODE_SIGN_STYLE: Automatic
targets:
  EpiphanyWatch:
    type: application
    platform: watchOS
    sources:
      - path: .
        excludes:
          - "*.xcodeproj"
          - "*.yml"
          - "*.md"
          - "*.svg"
          - MonicaWatchApp.swift
    settings:
      INFOPLIST_FILE: ""
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_WKWatchOnly: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.epiphany.watchos
      ASSETCATALOG_COMPILER_APPICON_NAME: Epiphany
      PRODUCT_NAME: Epiphany
