name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: README file references aren't stale
        run: |
          python3 - <<'PY'
          import re, os, sys
          refs = re.findall(r'(?:src="|\]\()([^")#?\s]+)', open("README.md").read())
          bad = [r for r in refs if "://" not in r and not r.startswith(("mailto:", "/")) and not os.path.exists(r)]
          print("stale README refs:", bad)
          sys.exit(bool(bad))
          PY

  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Benchmark engine self-check and script syntax
        run: |
          python3 -c "import sys; sys.path.insert(0, 'tradingview'); import backtest; backtest.check()"
          python3 -m py_compile scripts/ibkr-order.py scripts/ibkr-run.py scripts/menubar.py
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q ib_async
          /tmp/venv/bin/python -m unittest discover -s tests/py -v
          for f in scripts/tv-signal-agent.js tradingview/record-replay.mjs tradingview/record-watchlist.mjs tradingview/stats-watchlist.mjs tradingview/watchlist.mjs; do node --check "$f"; done
