    <script>
      (function () {
        // Follow the system setting, and keep following it if it flips while the page is open.
        var mq = null;
        try { mq = window.matchMedia('(prefers-color-scheme: light)'); } catch (_) {}
        function apply() {
          var theme = mq && mq.matches ? 'light' : 'dark';
          var bg = theme === 'dark' ? '#111111' : '#fafafa';
          window.__EPIPHANY_THEME__ = theme;
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          root.style.backgroundColor = bg;
          root.style.setProperty('--boot-bg', bg);
        }
        apply();
        if (mq && mq.addEventListener) mq.addEventListener('change', apply);
      })();
    </script>
